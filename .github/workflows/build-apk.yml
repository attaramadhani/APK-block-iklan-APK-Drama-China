name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4

      - name: Build debug APK
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: MeloloAdBlocker-debug
          path: app/build/outputs/apk/debug/*.apk

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v2.0.0-build${{ github.run_number }}
          name: Melolo AdBlocker v2.0.0 (build ${{ github.run_number }})
          body: |
            APK hasil build otomatis dari commit ${{ github.sha }}.
            Unduh **MeloloAdBlocker.apk** di bawah lalu pasang di HP Android.
          files: app/build/outputs/apk/debug/MeloloAdBlocker.apk
          make_latest: true

      - name: Unit tests
        run: ./gradlew testDebugUnitTest

      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-report
          path: app/build/reports/tests/
          if-no-files-found: ignore
